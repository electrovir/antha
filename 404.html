<!doctype html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Redirecting...</title> <script type="module"> const repoBase = "/antha"; const knownSubDirs = ["docs","demo"]; const path = window.location.pathname; const prefix = path.startsWith(repoBase + '/') ? path.slice(repoBase.length + 1) : ''; const subDir = prefix.split('/')[0]; if (!subDir || !knownSubDirs.includes(subDir)) { window.location.replace(repoBase + '/'); } else { const indexUrl = repoBase + '/' + subDir + '/index.html'; try { const response = await fetch(indexUrl); if (!response.ok) { throw new Error(String(response.status)); } const html = await response.text(); document.open(); document.write(html); document.close(); } catch { window.location.replace(repoBase + '/'); } } </script> </head> <body></body> </html>
